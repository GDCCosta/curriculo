<svg xmlns="http://www.w3.org/2000/svg" width="520" height="700" viewBox="0 0 520 700" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Exemplo visual do layout do currículo">
  <!-- Fundo da área -->
  <rect width="520" height="700" fill="#f4f6f9"/>

  <!-- Página -->
  <g>
    <rect x="30" y="24" width="460" height="652" rx="6" fill="#ffffff" stroke="#e1e6ed"/>

    <!-- Faixa do cabeçalho -->
    <rect x="30" y="24" width="460" height="74" rx="6" fill="#1d4ed8"/>
    <rect x="30" y="60" width="460" height="38" fill="#1d4ed8"/>
    <text x="50" y="58" fill="#ffffff" font-size="22" font-weight="600">Nome Sobrenome</text>
    <text x="50" y="82" fill="#c7dbf7" font-size="10">+55 (00) 00000-0000  |  email@exemplo.com  |  linkedin.com/in/seu-perfil</text>

    <!-- 01 - Objetivo -->
    <text x="50" y="130" fill="#1e40af" font-size="12" font-weight="600" letter-spacing="0.6">01 — OBJETIVO</text>
    <line x1="50" y1="138" x2="470" y2="138" stroke="#e1e6ed"/>
    <rect x="50" y="150" width="420" height="7" rx="3.5" fill="#e8ebf0"/>
    <rect x="50" y="162" width="400" height="7" rx="3.5" fill="#e8ebf0"/>

    <!-- 03 - Experiências -->
    <text x="50" y="206" fill="#1e40af" font-size="12" font-weight="600" letter-spacing="0.6">03 — EXPERIÊNCIAS PROFISSIONAIS</text>
    <line x1="50" y1="214" x2="470" y2="214" stroke="#e1e6ed"/>

    <!-- Experiência 1: título à esquerda, período à direita -->
    <text x="50" y="236" fill="#2563eb" font-size="11" font-weight="600">Empresa Exemplo</text>
    <text x="470" y="236" fill="#5a6472" font-size="9" text-anchor="end">2025 – Atual</text>
    <text x="50" y="250" fill="#5a6472" font-size="9" font-style="italic">Cargo: Título do Cargo Principal</text>
    <rect x="50" y="260" width="420" height="6" rx="3" fill="#e8ebf0"/>
    <rect x="50" y="271" width="420" height="6" rx="3" fill="#e8ebf0"/>
    <rect x="50" y="282" width="360" height="6" rx="3" fill="#e8ebf0"/>

    <!-- Experiência 2 -->
    <text x="50" y="312" fill="#2563eb" font-size="11" font-weight="600">Projeto / Atuação</text>
    <text x="470" y="312" fill="#5a6472" font-size="9" text-anchor="end">2022 – 2025</text>
    <text x="50" y="326" fill="#5a6472" font-size="9" font-style="italic">Cargo: Função Exercida</text>
    <circle cx="54" cy="340" r="2" fill="#2563eb"/>
    <rect x="62" y="337" width="408" height="6" rx="3" fill="#e8ebf0"/>
    <circle cx="54" cy="354" r="2" fill="#2563eb"/>
    <rect x="62" y="351" width="380" height="6" rx="3" fill="#e8ebf0"/>

    <!-- Experiência 3 -->
    <text x="50" y="386" fill="#2563eb" font-size="11" font-weight="600">Empresa Anterior</text>
    <text x="470" y="386" fill="#5a6472" font-size="9" text-anchor="end">2018 – 2022</text>
    <text x="50" y="400" fill="#5a6472" font-size="9" font-style="italic">Cargo: Função Anterior</text>
    <rect x="50" y="410" width="420" height="6" rx="3" fill="#e8ebf0"/>
    <rect x="50" y="421" width="340" height="6" rx="3" fill="#e8ebf0"/>

    <!-- 04 - Cursos -->
    <text x="50" y="462" fill="#1e40af" font-size="12" font-weight="600" letter-spacing="0.6">04 — CURSOS E CERTIFICADOS</text>
    <line x1="50" y1="470" x2="470" y2="470" stroke="#e1e6ed"/>
    <circle cx="54" cy="486" r="2" fill="#2563eb"/>
    <rect x="62" y="483" width="408" height="6" rx="3" fill="#e8ebf0"/>
    <circle cx="54" cy="500" r="2" fill="#2563eb"/>
    <rect x="62" y="497" width="370" height="6" rx="3" fill="#e8ebf0"/>
    <circle cx="54" cy="514" r="2" fill="#2563eb"/>
    <rect x="62" y="511" width="395" height="6" rx="3" fill="#e8ebf0"/>
  </g>
</svg>
